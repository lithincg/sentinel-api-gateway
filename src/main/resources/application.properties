spring.application.name=sentinel-gateway

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

# REDIS
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# SERVER CONFIGURATION
server.port=${PORT:8080}

# DOCKER
spring.docker.compose.enabled=false

# JWT
jwt.secretKey=${JWT_SECRETKEY:dev-only-sentinel-jwt-secret-key-at-least-32-bytes}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}