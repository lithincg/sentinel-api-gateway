spring.application.name=sentinel-gateway

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel_gateway
spring.datasource.username=sentinel_user
spring.datasource.password=sentinel_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# SERVER CONFIGURATION
server.port=8080

# DOCKER
spring.docker.compose.enabled=false

# JWT
jwt.secretKey=your-secret-key-here
jwt.expiration-minutes=60

# ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}